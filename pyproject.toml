[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loilonote-cli"
version = "0.3.0"
description = "CLI tool to automate LoiLoNote School web UI via Playwright"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "richi"},
]
keywords = ["loilonote", "playwright", "automation", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]

[project.scripts]
loilonote = "loilonote_cli.cli:cli"

[project.urls]
Homepage = "https://github.com/richi/loilonote-cli"
Repository = "https://github.com/richi/loilonote-cli"

[tool.setuptools.packages.find]
include = ["loilonote_cli*"]

[tool.ruff]
line-length = 120
target-version = "py39"
